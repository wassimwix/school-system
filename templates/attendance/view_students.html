{% load static %}
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض التلاميذ</title>
<link rel="stylesheet" href="{% static 'attendance/style.css' %}">
</head>
<body>
<div class="container">
    <h2>قائمة التلاميذ</h2>

    <a href="{% url 'home' %}" class="back-home">🏠 العودة إلى الصفحة الرئيسية</a>

    <div class="table-wrapper">
        <table>
            <tr>
                <th>الاسم الكامل</th>
                <th>الرقم المدرسي</th>
                <th>القسم</th>
                <th>سنة الميلاد</th>
                <th>QR Code</th>
            </tr>
            {% for student in students %}
            <tr>
                <td>{{ student.full_name }}</td>
                <td>{{ student.student_code }}</td>
                <td>{{ student.class_name }}</td>
                <td>{{ student.birth_year }}</td>
                <td>
                    <a href="{% url 'generate_qr' %}">تحميل Qr Code</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
</body>
</html>
